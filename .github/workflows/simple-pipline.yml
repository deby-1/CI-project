name: Classroom CI-CD Demo 2026

on:
  push:
    branches: [ main ]

jobs:
  build_stage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: npm install --prefix ./chat-app-source/backend

      - name: Install frontend dependencies
        run: npm install --prefix ./chat-app-source/frontend

      - name: Build frontend application
        run: npm run build --prefix ./chat-app-source/frontend

  test_stage:
    needs: build_stage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: npm install --prefix ./chat-app-source/backend

      - name: Install frontend dependencies
        run: npm install --prefix ./chat-app-source/frontend

      - name: Run frontend lint checks
        run: npm run lint --prefix ./chat-app-source/frontend

  deploy_stage:
    needs: test_stage
    runs-on: ubuntu-22.04

    steps:
      - name: Simulate Deploy
        run: |
          echo "=== STARTING DEPLOY STAGE ==="
          echo "Deploying the artifact to Staging environment..."
          echo "Deployment completed! App is live."
