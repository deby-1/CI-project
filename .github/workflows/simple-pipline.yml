name: Classroom CI-CD Demo 2026

on:
  push:
    branches: [ main ]

jobs:
  build_stage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            chat-application/backend/package-lock.json
            chat-application/frontend/package-lock.json

      - name: Install backend dependencies
        run: npm install --prefix ./chat-application/backend

      - name: Install frontend dependencies
        run: npm install --prefix ./chat-application/frontend

      - name: Build frontend application
        run: npm run build --prefix ./chat-application/frontend

  test_stage:
    needs: build_stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            chat-application/backend/package-lock.json
            chat-application/frontend/package-lock.json

      - name: Install backend dependencies
        run: npm install --prefix ./chat-application/backend

      - name: Install frontend dependencies
        run: npm install --prefix ./chat-application/frontend

      - name: Run frontend lint checks
        run: npm run lint --prefix ./chat-application/frontend

  deploy_stage:
    needs: test_stage
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Deploy
        run: |
          echo "=== STARTING DEPLOY STAGE ==="
          echo "Deploying the artifact to Staging environment..."
          echo "Deployment completed! App is live."
